# Keeps the workshop honest: overlays /solutions onto the starter and runs every test.
# If this goes red, a solution (or a test) has drifted.
name: solutions-pass-all-tests
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check-solutions
